[project]
name = "x86arm"
version = "0.1.0"
description = "Statically recompile Windows x86-64 programs into native macOS arm64 programs"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
x86arm = "x86arm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["x86arm"]
